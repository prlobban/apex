<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EFEDE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APEX">
<meta name="application-name" content="APEX">
<meta name="description" content="APEX // Hybrid Protocol — a 6-week concurrent training plan for strength, speed, vertical, endurance, flexibility, and skill.">
<title>APEX // Hybrid Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEDE6;
  --surface:#FFFFFF;
  --surface-2:#F7F4EC;
  --surface-3:#EAE6DA;
  --ink:#0A0A0F;
  --ink-2:#2A2A33;
  --ink-3:#55555E;
  --muted:#8A8A91;
  --line:#D6D2C5;
  --line-2:#C2BDAD;
  --accent:#FF2E5F;
  --accent-2:#0DD3D9;
  --accent-3:#FFB400;
  --good:#00B377;
  --warn:#E8841A;
  --bad:#D32852;

  --panel:#0A0A0F;       /* inverted dark-panel surface (heroes, timer, dark cards) */
  --panel-ink:#F5F1E6;   /* text on dark panels */

  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Manrope','SF Pro Text',system-ui,sans-serif;

  --r-xs:2px;--r-sm:4px;--r-md:6px;--r-lg:10px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;

  --nav-h:64px;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bot:env(safe-area-inset-bottom,0);
}
/* DARK THEME — flips the base palette; accents and panels stay vivid. */
:root.dark{
  color-scheme:dark;
  --bg:#0B0B0F;
  --surface:#15151B;
  --surface-2:#1B1B22;
  --surface-3:#26262F;
  --ink:#F3F0E7;
  --ink-2:#C7C5BC;
  --ink-3:#9E9C95;
  --muted:#76747C;
  --line:#2A2A33;
  --line-2:#3B3B47;
  --panel:#20202B;
  --panel-ink:#F5F1E6;
}
:root.dark body{
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(13,211,217,.12),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(255,46,95,.10),transparent 60%),
    var(--bg);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(13,211,217,.08),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(255,46,95,.06),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:0 0 0 2px rgba(10,10,15,.06)}
input[type=number]{font-family:var(--mono);font-weight:500}
::-webkit-scrollbar{width:0;height:0}

/* GRID OVERLAY */
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%)}

/* LAYOUT */
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 12px)}
.screen{padding:0 16px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 60%,rgba(239,237,230,0));z-index:5;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:26px;height:26px;background:var(--panel);border-radius:var(--r-sm);position:relative;display:grid;place-items:center}
.brand-mark::before{content:"";position:absolute;inset:3px;border:1.5px solid var(--accent);border-radius:1px}
.brand-mark::after{content:"";position:absolute;width:6px;height:6px;background:var(--accent-2);border-radius:50%}
.brand-name{font-family:var(--mono);font-weight:800;letter-spacing:.14em;font-size:14px}
.brand-tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2em;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.16em;padding:5px 8px;border:1px solid var(--line-2);border-radius:var(--r-xs);background:var(--surface);color:var(--ink-2);text-transform:uppercase}
.chip.live{border-color:var(--accent);color:var(--accent);position:relative;padding-left:18px}
.chip.live::before{content:"";position:absolute;left:7px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* HEADINGS */
.h-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.h-title{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0 0 4px;line-height:1.05}
.h-sub{color:var(--ink-3);font-size:14px;margin:0 0 18px}
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--ink-2);text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;position:relative;overflow:hidden}
.card.tinted{background:var(--surface-2)}
.card.dark{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}
.card.dark .h-eyebrow,.card.dark .muted{color:rgba(245,241,230,.55)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:transform .08s,opacity .15s,background .15s,color .15s;border:1px solid transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--panel);color:var(--panel-ink)}
.btn-primary:hover{filter:brightness(1.15)}
.btn-accent{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:8px 12px;font-size:10px}
.btn-block{width:100%}
.btn-icon{padding:10px;width:42px;height:42px}

/* ONBOARDING */
#onboarding{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;padding:24px 20px;padding-top:calc(24px + var(--safe-top));padding-bottom:calc(24px + var(--safe-bot))}
.onb-progress{display:flex;gap:4px;margin-bottom:24px}
.onb-progress .seg{flex:1;height:3px;background:var(--line);border-radius:2px;transition:background .25s}
.onb-progress .seg.done{background:var(--ink)}
.onb-progress .seg.active{background:var(--accent)}
.onb-step{flex:1;animation:fadeIn .3s ease}
.onb-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.onb-title{font-family:var(--mono);font-weight:800;font-size:28px;letter-spacing:-.01em;line-height:1.1;margin:0 0 8px}
.onb-desc{color:var(--ink-3);margin:0 0 24px;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-2);text-transform:uppercase;margin-bottom:6px}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.unit-input{position:relative}
.unit-input input{padding-right:42px}
.unit-input .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;pointer-events:none}
.onb-nav{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
.onb-nav .btn{flex:1}

/* BOTTOM NAV */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px;padding-bottom:calc(6px + var(--safe-bot));backdrop-filter:blur(10px);max-width:640px;margin:0 auto}
.nav-row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:var(--r-sm);font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;transition:color .15s,background .15s}
.nav-btn svg{width:20px;height:20px;margin-bottom:3px;stroke-width:1.6}
.nav-btn.active{color:var(--accent)}
.nav-btn.active svg{stroke:var(--accent)}
.nav-btn.timer-running{color:var(--accent-2)}
.nav-btn.timer-running svg{stroke:var(--accent-2)}
.nav-btn.timer-running::after{content:"";position:absolute;top:5px;left:calc(50% + 9px);width:6px;height:6px;border-radius:50%;background:var(--accent-2);animation:pulse 1.4s infinite}

/* TODAY */
.today-hero{position:relative;padding:20px 18px;border-radius:var(--r-md);background:var(--panel);color:var(--panel-ink);overflow:hidden;margin-bottom:16px}
.today-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0%,rgba(13,211,217,.25),transparent 60%),radial-gradient(400px 200px at 0% 100%,rgba(255,46,95,.2),transparent 60%);pointer-events:none}
.today-hero > *{position:relative}
.th-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(245,241,230,.7)}
.th-title{font-family:var(--mono);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.1;margin:0 0 6px}
.th-cat{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent-2);text-transform:uppercase}
.th-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.th-stat{padding:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-sm)}
.th-stat .label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:rgba(245,241,230,.55);text-transform:uppercase;margin-bottom:4px}
.th-stat .val{font-family:var(--mono);font-weight:700;font-size:18px;color:#F5F1E6}
.th-actions{display:flex;gap:8px}
.th-actions .btn{flex:1}
.btn-cta{background:var(--accent);color:#fff}
.btn-cta:hover{filter:brightness(1.05)}

.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.metric .label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.metric .val{font-family:var(--mono);font-weight:700;font-size:20px}
.metric .delta{font-family:var(--mono);font-size:10px;margin-top:2px}
.metric .delta.up{color:var(--good)}
.metric .delta.down{color:var(--bad)}

/* PROGRAM VIEW */
.week-strip{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:4px 16px;scroll-padding:16px;scroll-snap-type:x mandatory}
.week-chip{flex-shrink:0;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase;transition:.15s;scroll-snap-align:start;text-align:center;min-width:84px}
.week-chip.active{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}
.week-chip .sub{display:block;font-size:9px;letter-spacing:.18em;color:var(--accent-2);margin-top:2px;font-weight:500}
.week-chip:not(.active) .sub{color:var(--accent)}

.day-list{display:flex;flex-direction:column;gap:8px}
.day-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;transition:.15s}
.day-row:hover{border-color:var(--line-2)}
.day-row.today{border-color:var(--accent);background:linear-gradient(90deg,rgba(255,46,95,.04),var(--surface) 40%)}
.day-row.done{opacity:.55}
.day-row.done .day-num{background:var(--good);color:#fff}
.day-num{width:36px;height:36px;display:grid;place-items:center;background:var(--surface-3);border-radius:var(--r-xs);font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;flex-shrink:0}
.day-info{flex:1;min-width:0}
.day-name{font-weight:700;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-meta{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.day-arrow{color:var(--muted)}

/* WORKOUT DETAIL */
.wd-header{position:sticky;top:0;background:var(--bg);padding:14px 0 12px;z-index:3;border-bottom:1px solid var(--line);margin-bottom:14px}
.wd-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.wd-title{font-family:var(--mono);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1;margin:0 0 4px}
.wd-meta{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}

.block{margin-bottom:18px}
.block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.block-tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
.block-note{font-size:12px;color:var(--ink-3);margin-bottom:10px}

.exercise{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden;transition:.15s}
.exercise.done{background:var(--surface-2);border-color:var(--line-2)}
.ex-head{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ex-letter{width:24px;height:24px;display:grid;place-items:center;background:var(--surface-3);border-radius:var(--r-xs);font-family:var(--mono);font-weight:700;font-size:11px;flex-shrink:0;margin-top:1px}
.exercise.done .ex-letter{background:var(--good);color:#fff}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:700;font-size:15px;margin-bottom:2px}
.ex-prescribed{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.ex-cues{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.ex-body{padding:0 16px 16px;border-top:1px solid var(--line);display:none}
.exercise.open .ex-body{display:block}
.exercise.open .ex-head{padding-bottom:12px}
.set-table{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set-row{display:grid;grid-template-columns:36px 1fr 1fr 60px 36px;gap:6px;align-items:center}
.set-row .set-num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-align:center}
.set-row input{padding:8px 10px;font-size:13px;text-align:center}
.set-row .rpe-select{padding:8px 6px;font-size:12px;text-align:center;background:var(--surface)}
.set-row .check{width:28px;height:28px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-xs);justify-self:center}
.set-row .check.checked{background:var(--good);color:#fff;border-color:var(--good)}
.set-headers{display:grid;grid-template-columns:36px 1fr 1fr 60px 36px;gap:6px;margin-bottom:4px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:center}
.ex-actions{display:flex;gap:8px;margin-top:12px}
.set-mgmt{display:flex;gap:8px;align-items:center;margin-top:10px}
.set-mgmt-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.btn:disabled{opacity:.4;pointer-events:none}
.notes-input{margin-top:8px;font-size:13px;min-height:60px;resize:vertical}

.warmup-list{background:var(--surface-2);border-radius:var(--r-sm);padding:14px}
.warmup-list ul{margin:0;padding:0;list-style:none}
.warmup-list li{padding:6px 0;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.warmup-list li:last-child{border-bottom:none}
.warmup-list li::before{content:"";width:6px;height:6px;background:var(--accent);border-radius:50%;flex-shrink:0}

.complete-banner{margin-top:24px;padding:20px;background:var(--panel);color:var(--panel-ink);border-radius:var(--r-md);text-align:center}
.complete-banner h3{font-family:var(--mono);font-weight:800;letter-spacing:.04em;margin:0 0 8px}
.complete-banner p{margin:0 0 14px;color:rgba(245,241,230,.7);font-size:13px}

/* TIMER */
.timer-modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.tmode{padding:10px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase;transition:.15s;text-align:center}
.tmode.active{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}

.timer-config{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:16px}
.tconf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tconf-row.three{grid-template-columns:1fr 1fr 1fr}

.timer-display{position:relative;background:var(--panel);color:var(--panel-ink);border-radius:var(--r-md);padding:36px 20px;text-align:center;overflow:hidden;margin-bottom:14px}
.timer-display::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,46,95,.1),transparent 70%);opacity:0;transition:opacity .3s}
.timer-display.work::before{opacity:1;background:radial-gradient(circle at 50% 50%,rgba(13,211,217,.15),transparent 70%)}
.timer-display.rest::before{opacity:1;background:radial-gradient(circle at 50% 50%,rgba(255,46,95,.15),transparent 70%)}
.timer-display.warning::before{opacity:1;background:radial-gradient(circle at 50% 50%,rgba(255,180,0,.2),transparent 70%);animation:warnpulse .6s infinite}
@keyframes warnpulse{0%,100%{opacity:.6}50%{opacity:1}}
.timer-display > *{position:relative}
.t-phase{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--accent-2);text-transform:uppercase;margin-bottom:14px}
.timer-display.rest .t-phase{color:var(--accent)}
.timer-display.warning .t-phase{color:var(--accent-3)}
.t-time{font-family:var(--mono);font-weight:800;font-size:84px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.t-round{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:rgba(245,241,230,.7);text-transform:uppercase;margin-top:12px}

.timer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer-actions.solo{grid-template-columns:1fr}

/* SKILLS */
.skill-grid{display:flex;flex-direction:column;gap:10px}
.skill-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.skill-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.skill-name{font-weight:700;font-size:15px}
.skill-week{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;background:rgba(255,46,95,.08);padding:3px 6px;border-radius:var(--r-xs)}
.skill-desc{font-size:13px;color:var(--ink-3);margin-bottom:8px}
.skill-cues{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:8px 10px;border-radius:var(--r-sm);border-left:2px solid var(--accent-2)}
.skill-warn{font-family:var(--mono);font-size:11px;color:var(--warn);background:rgba(232,132,26,.06);padding:8px 10px;border-radius:var(--r-sm);border-left:2px solid var(--warn);margin-top:6px}

/* PROFILE */
.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.pr .label{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.pr .val{font-family:var(--mono);font-weight:700;font-size:22px;line-height:1}
.pr .unit{font-size:11px;color:var(--muted);margin-left:4px;font-weight:400}
.pr .delta{font-family:var(--mono);font-size:10px;margin-top:4px}
.pr .delta.up{color:var(--good)}
.pr .delta.down{color:var(--bad)}

.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.toggle-label{font-size:14px}
.toggle-desc{font-size:12px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:42px;height:24px;background:var(--surface-3);border-radius:12px;transition:background .2s;flex-shrink:0;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;left:2px;top:1px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:21px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,15,.4);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--surface);border-radius:var(--r-md) var(--r-md) 0 0;width:100%;max-width:640px;padding:20px 16px;padding-bottom:calc(20px + var(--safe-bot));max-height:85vh;overflow-y:auto;animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:var(--mono);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0 0 12px}

/* MISC */
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--ink-2)}
.tag.accent{background:rgba(255,46,95,.08);color:var(--accent)}
.tag.teal{background:rgba(13,211,217,.1);color:#0AA8AD}
.muted{color:var(--muted)}
.divider{height:1px;background:var(--line);margin:16px 0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-icon{width:48px;height:48px;margin:0 auto 12px;opacity:.4}

/* ICONS */
.icon{display:inline-block;vertical-align:middle}

/* ACCESSIBILITY */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ex-head:focus-visible{outline-offset:-2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

@media (max-width:380px){
  .t-time{font-size:64px}
  .set-row{grid-template-columns:30px 1fr 1fr 56px 30px}
  .set-headers{grid-template-columns:30px 1fr 1fr 56px 30px}
}

<script>
/* =========================================================================
   APEX // HYBRID PROTOCOL — 6 WEEK CONCURRENT TRAINING PWA
   Built for: 18yo hurdler, post-Achilles, ~170lb, 6ft, garage gym, 245lb cap
   ========================================================================= */

// ============ STORAGE LAYER ============
const KEY = {
  profile: 'apex:profile',
  settings: 'apex:settings',
  logs: 'apex:logs',
  prs: 'apex:prs',
  ui: 'apex:ui',
  timer: 'apex:timer'
};
// Adaptive backend: window.storage (original restricted env) → localStorage
// (normal browser) → in-memory (private mode / file://). Async signatures kept
// throughout so the rest of the codebase never changes.
const Store = (() => {
  if(typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    return {
      async get(k, def=null){
        try{ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : def; }
        catch(e){ return def; }
      },
      async set(k, v){
        try{ await window.storage.set(k, JSON.stringify(v)); return true; }
        catch(e){ console.warn('storage set failed', e); return false; }
      },
      async del(k){ try{ await window.storage.delete(k); }catch(e){} }
    };
  }
  // localStorage with an in-memory fallback when it's unavailable or throws.
  const mem = {};
  let ls = null;
  try{ ls = window.localStorage; const t = '__apex_probe__'; ls.setItem(t,'1'); ls.removeItem(t); }
  catch(e){ ls = null; }
  return {
    async get(k, def=null){
      try{ const v = ls ? ls.getItem(k) : (k in mem ? mem[k] : null); return v != null ? JSON.parse(v) : def; }
      catch(e){ return def; }
    },
    async set(k, v){
      try{ const s = JSON.stringify(v); if(ls) ls.setItem(k, s); else mem[k] = s; return true; }
      catch(e){ console.warn('storage set failed', e); return false; }
    },
    async del(k){ try{ if(ls) ls.removeItem(k); else delete mem[k]; }catch(e){} }
  };
})();

// ============ AUDIO ============
let audioCtx = null;
function beep(freq=880, duration=0.12, vol=0.25){
  if(!STATE.settings.audio) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.stop(audioCtx.currentTime + duration + .02);
  }catch(e){}
}
function beepLow(){ beep(440, 0.12, 0.2); }
function beepHigh(){ beep(880, 0.16, 0.25); }
function beepEnd(){ beep(660, 0.08, 0.2); setTimeout(()=>beep(880, 0.08, 0.2), 100); setTimeout(()=>beep(1320, 0.3, 0.3), 200); }

// ============ 6-WEEK PROGRAM ============
const WEEKS = [
  { n:1, phase:'FOUNDATION',  focus:'Movement quality. Volume up, intensity moderate. Build the engine.' },
  { n:2, phase:'FOUNDATION+', focus:'Same template, +1 rep / +5lb where RPE permits. Sprint volume +1 set.' },
  { n:3, phase:'DEVELOPMENT', focus:'Intensity up. Heavier loads. Plyos progress. Splits push.' },
  { n:4, phase:'DEVELOPMENT+',focus:'Top-end intensity. Flying sprints. 5K time trial midweek.' },
  { n:5, phase:'PEAK',        focus:'Heavy singles/doubles. Max-effort plyos. Skill consolidation.' },
  { n:6, phase:'TEST',        focus:'Days 1-3 peak. Day 4 deload. Days 5-6 RETEST benchmarks.' },
];

// Helper to build a day with progressive prescriptions per week
function day(name, cat, blocks){ return { name, cat, blocks }; }
function block(tag, items, note){ return { tag, note, items }; }
function ex(id, sets, reps, load, notes){ return { id, sets, reps, load, notes }; }
function warm(items){ return { tag:'warmup', items, note:null }; }
function note(text){ return { tag:'note', text }; }

// ----- WEEK 1: FOUNDATION -----
const W1 = [
  // Day 1 — Lower Power & Sprint
  day('Lower Power & Sprint', 'lower-power', [
    warm(['Cardio: jump rope 2 min OR jog 400m', 'Leg swings front/back 10/leg', 'Leg swings lateral 10/leg', 'World\'s greatest stretch 5/side', 'Lateral lunge 8/side', 'A-skips 2x20m', 'B-skips 2x20m', 'Strides 3x40m at 70%']),
    block('PLYO', [

    ], 'Track or street. Soft surface preferred for the foot.'),

  day('Lower Posterior & Speed Endurance', 'lower-strength', [

    block('STRENGTH', [

// ============ HELPERS ============
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else if(attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function $(sel){ return document.querySelector(sel); }
function fmt(n){ return n==null?'—':n; }
function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
// PR value parsing: "215 lb" → 215, "22:30" → 1350 (seconds), "3.5" → 3.5.
function prIsTime(raw){ return /^\d+:\d{1,2}(:\d{1,2})?$/.test(String(raw==null?'':raw).trim()); }
function prNumeric(raw){
  if(raw == null) return NaN;
  const s = String(raw).trim();
  if(prIsTime(s)) return s.split(':').map(Number).reduce((a,n)=>a*60+n, 0);
  const m = s.replace(/,/g,'').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
// Direction-aware delta between baseline and latest PR entries.
// dir 'lower' means a decrease is an improvement (sprint times, splits-from-floor).
function prDelta(baseline, latest, dir='higher', unit=''){
  if(!baseline || !latest || latest === baseline) return null;
  const a = prNumeric(baseline.value), b = prNumeric(latest.value);
  if(isNaN(a) || isNaN(b) || a === b) return null;
  const raw = b - a;                                   // positive = value went up
  const improved = dir === 'lower' ? raw < 0 : raw > 0;
  const isTime = prIsTime(latest.value) || prIsTime(baseline.value);
  const mag = isTime ? formatTime(Math.round(Math.abs(raw))) : Math.abs(raw).toFixed(1).replace(/\.0$/,'');
  const arrow = raw > 0 ? '▲' : '▼';
  return { improved, text:`${arrow} ${mag}${isTime?'':(unit?' '+unit:'')}` };
}
function todayDayIndex(){
  // Map JS day (0=Sun) to program day index (0=Mon ... 5=Sat, 6=Rest)
  const js = new Date().getDay();
  return [6,0,1,2,3,4,5][js];
}
function exerciseDisplay(item){
  // Resolves an exercise reference to {name, cues}
  if(item.name){ return { name:item.name, cues:item.notes||'' }; }
  if(item.id && EX[item.id]){ return { name:EX[item.id].n, cues:EX[item.id].c, notes:item.notes||'' }; }
  return { name:'Exercise', cues:'' };
}
function getLogKey(w,d){ return `w${w}_d${d}`; }
async function saveLog(w, d, data){

function weekCompletion(w){

}
// Consecutive calendar days ending today or yesterday with a completed session.
function computeStreak(){
  const DAY = 86400000;
  const days = new Set();
  Object.values(STATE.logs).forEach(l=>{
    if(l && l.completed && l.completedAt){
      const d = new Date(l.completedAt); d.setHours(0,0,0,0);
      days.add(d.getTime());
    }
  });
  if(!days.size) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  let cursor = today.getTime();
  if(!days.has(cursor)){ cursor -= DAY; if(!days.has(cursor)) return 0; }
  let streak = 0;
  while(days.has(cursor)){ streak++; cursor -= DAY; }
  return streak;
}

    case 'timer': renderTimer(); break;
    case 'skills': renderSkills(); break;
    case 'profile': renderProfile(); break;
    case 'workout': renderWorkout(); break;
  }
}

function renderWorkout(){
  const app = $('#app');
  const { week, day } = STATE.workout.open;
  const d = PROGRAM[week-1][day];
  const logKey = getLogKey(week, day);
  const log = STATE.logs[logKey] || { completed:false, sets:{}, notes:{} };
  STATE.logs[logKey] = log;

  app.appendChild(renderTopbar(`W${week} D${day+1}`));
  const screen = el('div', { class:'screen' });

  // Header
  const header = el('div', { class:'wd-header' }, [
    el('button', { class:'wd-back', onclick:()=>{STATE.route='program';render();} }, '← BACK TO PROGRAM'),
    el('h1', { class:'wd-title' }, d.name),
    el('div', { class:'wd-meta' }, `WEEK ${week} • ${DAY_NAMES[day]} • ${WEEKS[week-1].phase}`)
  ]);
  screen.appendChild(header);

  // Blocks
  d.blocks.forEach((b, bi)=>{
    if(b.tag === 'warmup'){
      const wrap = el('div', { class:'block' }, [
        el('div', { class:'block-header' }, [
          el('span', { class:'block-tag' }, 'WARM-UP')
        ]),
        el('div', { class:'warmup-list' }, [
          el('ul', {}, b.items.map(i => el('li', {}, i)))
        ])
      ]);
      screen.appendChild(wrap);
      return;
    }

    const blk = el('div', { class:'block' }, [
      el('div', { class:'block-header' }, [
        el('span', { class:'block-tag' }, b.tag),
      ]),
      b.note ? el('div', { class:'block-note' }, b.note) : null
    ]);

    b.items.forEach((item, ii)=>{
      const exKey = `${bi}_${ii}`;
      const disp = exerciseDisplay(item);
      const prescribed = item.sets || 3;
      const setCount = (log.setCounts && log.setCounts[exKey]) || prescribed;
      const targetReps = item.reps;
      const targetLoad = item.load;

      const exEl = el('div', { class:'exercise' });
      const isOpen = log.openExercise === exKey;
      if(isOpen) exEl.classList.add('open');

      // Check completion
      const setData = log.sets[exKey] || [];
      const allDone = setData.length >= setCount && setData.every(s => s.done);
      if(allDone) exEl.classList.add('done');

      const toggleOpen = ()=>{
        log.openExercise = (log.openExercise === exKey) ? null : exKey;
        saveLog(week, day, log); render();
      };
      const head = el('div', {
        class:'ex-head', role:'button', tabindex:'0',
        'aria-expanded':String(isOpen),
        'aria-label':`${disp.name}, ${setCount} sets of ${targetReps}. Toggle details.`,
        onclick:toggleOpen,
        onkeydown:(e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleOpen(); } }
      }, [
        el('div', { class:'ex-letter' }, allDone ? '✓' : String.fromCharCode(65 + ii)),
        el('div', { class:'ex-main' }, [
          el('div', { class:'ex-name' }, disp.name),
          el('div', { class:'ex-prescribed' }, `${setCount} × ${targetReps}${targetLoad ? ' @ ' + targetLoad : ''}`),
          (disp.cues || disp.notes) ? el('div', { class:'ex-cues' }, disp.cues + (disp.notes ? ' ' + disp.notes : '')) : null
        ]),
        el('span', { 'aria-hidden':'true', style:{color:'var(--muted)',fontFamily:'var(--mono)',fontSize:'14px'} }, isOpen ? '−' : '+')
      ]);
      exEl.appendChild(head);

      // Body
      const body = el('div', { class:'ex-body' });
      body.appendChild(el('div', { class:'set-headers' }, [
        el('div', {}, 'SET'),
        el('div', {}, 'WEIGHT'),
        el('div', {}, 'REPS'),
        el('div', {}, 'RPE'),
        el('div', {}, '✓')
      ]));
      const setTable = el('div', { class:'set-table' });
      for(let s=0; s<setCount; s++){
        const cur = setData[s] || {};
        const row = el('div', { class:'set-row' });
        row.appendChild(el('div', { class:'set-num' }, s+1));

  screen.appendChild(el('div', { class:'complete-banner' }, [

        beepEnd();
        render();

  ]));

  app.appendChild(screen);
}

async function updateSet(w, d, exKey, setIdx, field, value){
  const lk = getLogKey(w, d);
  const log = STATE.logs[lk] || { completed:false, sets:{}, notes:{} };
  if(!log.sets[exKey]) log.sets[exKey] = [];
  if(!log.sets[exKey][setIdx]) log.sets[exKey][setIdx] = {};
  log.sets[exKey][setIdx][field] = value;
  STATE.logs[lk] = log;
  await Store.set(KEY.logs, STATE.logs);
  // re-render only the check state — for simplicity re-render full screen
  if(field === 'done') render();
}

async function changeSetCount(w, d, exKey, prescribed, delta){
  const lk = getLogKey(w, d);
  const log = STATE.logs[lk] || { completed:false, sets:{}, notes:{} };
  if(!log.setCounts) log.setCounts = {};
  const cur = log.setCounts[exKey] || prescribed;
  const next = Math.max(1, Math.min(20, cur + delta));
  log.setCounts[exKey] = next;
  // Drop any logged data for sets that no longer exist.
  if(log.sets[exKey] && log.sets[exKey].length > next) log.sets[exKey].length = next;
  await saveLog(w, d, log);
  render();
}

function cfgInput(label, key, defaultVal, ref){
  if(!STATE.timer.config[key]) STATE.timer.config[key] = defaultVal;
  const fEl = el('div', { class:'field', style:{marginBottom:0} });
  fEl.appendChild(el('label', {}, label));
  const inp = el('input', { type:'number', value:STATE.timer.config[key], min:'1', 'aria-label':label });
  inp.addEventListener('change', e=>{ STATE.timer.config[key] = parseInt(e.target.value)||1; Store.set(KEY.timer, STATE.timer.config); });
  fEl.appendChild(inp);
  return fEl;
}

function startTimer(){
  const m = STATE.timer.mode;
  const c = STATE.timer.config;
  let work, rest, rounds;
  if(m === 'interval' || m === 'tabata'){
    work = c.work; rest = c.rest; rounds = c.rounds;
  } else if(m === 'emom'){
    work = c.work; rest = 60 - c.work; rounds = c.minutes;
  } else if(m === 'amrap'){
    work = c.minutes * 60; rest = 0; rounds = 1;
  }
  STATE.timer.running = true;
  STATE.timer.phase = 'work';
  STATE.timer.remaining = work;
  STATE.timer.round = 1;
  STATE.timer.totalRounds = rounds;
  STATE.timer._work = work;
  STATE.timer._rest = rest;
  beepHigh();
  if(audioCtx?.state === 'suspended') audioCtx.resume();
  render();
  tick();
}

function tick(){
  if(!STATE.timer.running) return;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    STATE.timer.remaining--;
    if(STATE.timer.remaining === 3 || STATE.timer.remaining === 2 || STATE.timer.remaining === 1){
      beepLow();
    }
    if(STATE.timer.remaining <= 0){
      // Phase change
      if(STATE.timer.phase === 'work'){
        if(STATE.timer._rest > 0 && STATE.timer.round < STATE.timer.totalRounds){
          STATE.timer.phase = 'rest';
          STATE.timer.remaining = STATE.timer._rest;
          beepHigh();
        } else if(STATE.timer.round < STATE.timer.totalRounds){
          STATE.timer.round++;
          STATE.timer.phase = 'work';
          STATE.timer.remaining = STATE.timer._work;
          beepHigh();
        } else {
          // Done
          beepEnd();
          stopTimer();
          return;
        }
      } else {
        STATE.timer.round++;
        STATE.timer.phase = 'work';
        STATE.timer.remaining = STATE.timer._work;
        beepHigh();
      }
    }
    // Update visible
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay(){
  const disp = document.querySelector('#main-timer');
  if(!disp) return;
  disp.className = 'timer-display ' + STATE.timer.phase + (STATE.timer.remaining <= 3 && STATE.timer.remaining > 0 ? ' warning' : '');
  disp.querySelector('.t-phase').textContent = STATE.timer.phase.toUpperCase();
  disp.querySelector('.t-time').textContent = formatTime(STATE.timer.remaining);
  disp.querySelector('.t-round').textContent = STATE.timer.totalRounds > 0 ? `ROUND ${STATE.timer.round} / ${STATE.timer.totalRounds}` : '—';
}

function updateTimerNav(){
  const btn = document.querySelector('.nav-btn[data-route="timer"]');
  if(btn) btn.classList.toggle('timer-running', !!STATE.timer.running);
}

function stopTimer(){
  STATE.timer.running = false;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  updateTimerNav();
  // Only rebuild the timer screen; never disrupt input focus on other screens.
  if(STATE.route === 'timer') render();
}
function resetTimer(){
  stopTimer();
  STATE.timer.remaining = 0;
  STATE.timer.round = 0;
  STATE.timer.totalRounds = 0;
  render();
}

// Inline rest timer (modal)
function openRestTimer(seconds){
  const ov = el('div', { class:'modal-overlay', onclick:e=>{ if(e.target.classList.contains('modal-overlay')){ if(restTimerInterval) clearInterval(restTimerInterval); ov.remove(); } } });
  const m = el('div', { class:'modal' });
  let remaining = seconds;
  const display = el('div', { class:'timer-display', style:{margin:'0 0 14px'} }, [
    el('div', { class:'t-phase' }, 'REST'),
    el('div', { class:'t-time' }, formatTime(remaining)),
    el('div', { class:'t-round' }, '—')
  ]);
  m.appendChild(el('div', { class:'modal-title' }, 'Rest Timer'));
  m.appendChild(display);
  m.appendChild(el('div', { style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'} }, [
    el('button', { class:'btn btn-ghost', onclick:()=>{ if(restTimerInterval) clearInterval(restTimerInterval); ov.remove(); } }, 'Cancel'),
    el('button', { class:'btn btn-accent', onclick:()=>{ remaining += 30; display.querySelector('.t-time').textContent = formatTime(remaining); } }, '+30s')
  ]));
  ov.appendChild(m);
  document.body.appendChild(ov);
  if(audioCtx?.state === 'suspended') audioCtx.resume();
  beepHigh();
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(()=>{
    remaining--;
    display.querySelector('.t-time').textContent = formatTime(remaining);
    if(remaining === 3 || remaining === 2 || remaining === 1) beepLow();
    if(remaining <= 0){
      clearInterval(restTimerInterval);
      beepEnd();
      setTimeout(()=>ov.remove(), 1500);
    }
  }, 1000);
}

function exportData(){

function openPRModal(p){
  const series = STATE.prs[p.k] || [];
  const ov = el('div', { class:'modal-overlay', onclick:e=>{ if(e.target.classList.contains('modal-overlay')) ov.remove(); } });
  const m = el('div', { class:'modal' });
  m.appendChild(el('div', { class:'modal-title' }, p.label));
  m.appendChild(el('p', { style:{margin:'0 0 14px',fontSize:'13px',color:'var(--muted)'} }, `PR history. ${p.dir==='lower'?'Lower is better here.':'Higher is better here.'} Add new entries to track progression.`));

  // Progress summary (direction-aware)
  if(series.length > 1){
    const d = prDelta(series[0], series[series.length-1], p.dir, p.unit);
    if(d){
      m.appendChild(el('div', { style:{
        display:'flex',justifyContent:'space-between',alignItems:'center',
        padding:'10px 12px',marginBottom:'14px',borderRadius:'var(--r-sm)',
        background:'var(--surface-2)',borderLeft:'2px solid var(--'+(d.improved?'good':'bad')+')'
      } }, [
        el('div', { style:{fontSize:'11px',letterSpacing:'.12em',fontFamily:'var(--mono)',color:'var(--muted)',textTransform:'uppercase'} }, d.improved ? 'Progress' : 'Down from baseline'),
        el('div', { style:{fontFamily:'var(--mono)',fontWeight:700,color:'var(--'+(d.improved?'good':'bad')+')'} }, d.text)
      ]));
    }
  }

  // History
  if(series.length === 0){
    m.appendChild(el('div', { class:'empty' }, [el('p', {}, 'No entries yet.')]));
  } else {
    const list = el('div', { style:{display:'flex',flexDirection:'column',gap:'6px',marginBottom:'14px'} });
    series.slice().reverse().forEach((entry, idx)=>{
      list.appendChild(el('div', {
        style:{
          padding:'10px 12px',background:'var(--surface-2)',border:'1px solid var(--line)',borderRadius:'var(--r-sm)',
          display:'flex',justifyContent:'space-between',alignItems:'center'
        }
      }, [
        el('div', {}, [
          el('div', { style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:'16px'} }, `${entry.value}${p.unit?' '+p.unit:''}`),
          el('div', { style:{fontSize:'11px',color:'var(--muted)',marginTop:'2px'} }, new Date(entry.date).toLocaleDateString() + (entry.note?' • '+entry.note:''))
        ]),
        idx === 0 ? el('span', { class:'tag accent' }, 'LATEST') : null
      ]));
    });
    m.appendChild(list);
  }

  // Add new entry
  m.appendChild(el('div', { class:'h-eyebrow' }, 'NEW ENTRY'));
  const newVal = el('input', { type:'text', placeholder:'Value' });
  const newNote = el('input', { type:'text', placeholder:'Note (optional)', style:{marginTop:'8px'} });
  m.appendChild(el('div', { style:{marginTop:'8px'} }, [newVal]));
  m.appendChild(newNote);
  m.appendChild(el('div', { style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginTop:'12px'} }, [
    el('button', { class:'btn btn-ghost', onclick:()=>ov.remove() }, 'Cancel'),
    el('button', { class:'btn btn-accent', onclick:async ()=>{
      const v = newVal.value.trim();
      if(!v) return;
      if(!STATE.prs[p.k]) STATE.prs[p.k] = [];
      STATE.prs[p.k].push({ date:Date.now(), value:v, note:newNote.value.trim() });
      await Store.set(KEY.prs, STATE.prs);
      ov.remove();
      render();
    } }, 'Save')
  ]));
  ov.appendChild(m);
  document.body.appendChild(ov);
}

// ============ PWA / INSTALL ============
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(STATE.route === 'profile') render(); // reveal the install button if visible
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  if(STATE.route === 'profile') render();
});
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isiOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
// Render the APEX mark to a PNG data URL at the requested size (maskable-safe).
function apexIconDataURL(size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0A0A0F';
  roundRectPath(x, 0, 0, size, size, size*0.18); x.fill();
  const pad = size*0.28;
  x.strokeStyle = '#FF2E5F';
  x.lineWidth = Math.max(2, size*0.04);
  roundRectPath(x, pad, pad, size-2*pad, size-2*pad, size*0.05); x.stroke();
  x.fillStyle = '#0DD3D9';
  x.beginPath(); x.arc(size/2, size/2, size*0.07, 0, Math.PI*2); x.fill();
  return c.toDataURL('image/png');
}
// Build + inject a web-app manifest at runtime so the app stays a single file.
function setupPWA(){
  try{
    const icon192 = apexIconDataURL(192);
    const icon512 = apexIconDataURL(512);
    const here = location.pathname.split('/').pop() || '.';   // open this exact page, not the dir index
    const manifest = {
      name:'APEX // Hybrid Protocol', short_name:'APEX',
      description:'6-week concurrent training plan.',
      start_url:here, scope:'./', display:'standalone', orientation:'portrait',
      background_color:'#0B0B0F',
      theme_color:(STATE.settings.theme === 'dark' ? '#0B0B0F' : '#EFEDE6'),
      icons:[
        { src:icon192, sizes:'192x192', type:'image/png', purpose:'any maskable' },
        { src:icon512, sizes:'512x512', type:'image/png', purpose:'any maskable' }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
    setLink('manifest', url);
    setLink('apple-touch-icon', icon192);
    setLink('icon', icon192);
  }catch(e){ console.warn('PWA setup failed', e); }
}
function setLink(rel, href){
  let link = document.querySelector(`link[rel="${rel}"]`);
  if(!link){ link = document.createElement('link'); link.rel = rel; document.head.appendChild(link); }
  link.href = href;
}
function installRow(){
  if(isStandalone()) return null;
  const sec = el('div', { style:{marginTop:'18px',paddingTop:'14px',borderTop:'1px solid var(--line)'} });
  sec.appendChild(el('div', { class:'h-eyebrow' }, 'APP'));
  if(deferredInstallPrompt){
    sec.appendChild(el('p', { style:{margin:'6px 0 8px',fontSize:'12px',color:'var(--muted)'} }, 'Install APEX to your home screen for full-screen, offline-style use.'));
    sec.appendChild(el('button', { class:'btn btn-ghost btn-sm', onclick:async ()=>{
      deferredInstallPrompt.prompt();
      try{ const r = await deferredInstallPrompt.userChoice; if(r.outcome === 'accepted') deferredInstallPrompt = null; }catch(e){}
      render();
    } }, '↓ Install App'));
  } else {
    sec.appendChild(el('p', { style:{margin:'6px 0 0',fontSize:'12px',color:'var(--muted)'} },
      isiOS() ? 'To install: tap the Share button, then “Add to Home Screen.”'
              : 'To install: open your browser menu and choose “Install app” / “Add to Home screen.”'));
  }
  return sec;
}

// ============ INIT ============
async function init(){
  // Load all state
  const [profile, settings, logs, prs, ui, timerConfig] = await Promise.all([
    Store.get(KEY.profile),
    Store.get(KEY.settings, { audio:true, units:'lb' }),
    Store.get(KEY.logs, {}),
    Store.get(KEY.prs, {}),
    Store.get(KEY.ui, { currentWeek:1 }),
    Store.get(KEY.timer, {})
  ]);
  STATE.profile = profile;
  STATE.settings = settings;
  STATE.logs = logs;
  STATE.prs = prs;
  STATE.ui = ui;
  STATE.timer.config = { ...STATE.timer.config, ...(timerConfig || {}) };

  // Apply persisted theme before first paint, then wire up installability.
  applyTheme(STATE.settings.theme === 'dark');
  setupPWA();

  // Wire nav
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      // Initialize audio context on first interaction
      if(!audioCtx){
        try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
      }
      route(b.dataset.route);
    });
  });

  render();
}

// Wait for DOM
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
